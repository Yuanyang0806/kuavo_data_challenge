name: Validate OpenLET ACT21 scripts
on:
  push:
    branches:
      - assist/openlet-onepass-20261016
    paths:
      - "tools/task1_act21_ros_bridge.py"
      - "tools/task1_act21_gpu_client.py"
      - "tools/score_task1_act21_model_entry_once.py"
      - "tools/diagnose_task1_act_online_domain_gap.py"
      - "tools/diagnose_task1_act_expert_onset.py"
      - ".github/workflows/validate-act21.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax
        run: |
          python -m py_compile tools/task1_act21_ros_bridge.py tools/task1_act21_gpu_client.py tools/score_task1_act21_model_entry_once.py tools/diagnose_task1_act_online_domain_gap.py tools/diagnose_task1_act_expert_onset.py
          python tools/score_task1_act21_model_entry_once.py --help
